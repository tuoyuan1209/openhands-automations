# 项目流程说明，非 Canvas 原生导入格式；实际控制器为 web/flow.py。
workflow: vendor_validation_v3_2
mode: verify_only
before_approval: ['01','00']
compare: {on_mismatch: FAIL, on_unknown: INCONCLUSIVE}
approval_required: true
after_approval: ['01','00','02','03','04','05','06','07','08']
stop_on: [FAIL, INCONCLUSIVE, WARN]
long_test: {stage: '08', duration_s: 3600, execution: local_persistent_controller}
objective_report: {stage: '09', execution: local, if_session_exists: true}
agent_analysis: {stages: ['10','11','12'], failure_only: ['11'], objective_status_immutable: true}
